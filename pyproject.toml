[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenblind"
version = "0.2.0"
description = "Find changes your passing test command does not notice."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
greenblind = "greenblind.cli:main"

[tool.setuptools.packages.find]
include = ["greenblind*"]
